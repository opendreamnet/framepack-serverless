on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      docker-push:
        type: boolean
        default: ${{ github.event_name != 'pull_request' }}
      docker-image-name:
        type: string
        required: false
        default: ghcr.io/${{ github.repository }}
      docker-file:
        type: string
        required: false
        default: ./Dockerfile
      docker-platforms:
        type: string
        required: false
        default: linux/amd64
      docker-build-args:
          required: false
          type: string
      docker-no-cache:
        type: boolean
        default: false
      docker-cache-mode:
        type: string
        default: max
      docker-gha-cache-mode:
        type: string
        default: min
      working-directory:
        type: string
        required: false
        default: "."
      deploy-url:
        required: false
        type: string
      runs-on:
        type: string
        default: ubuntu-latest

jobs:
  build:
    name: build
    runs-on: ${{ inputs.runs-on }}

    env:
      GIT_SHA: ${{ github.sha }}
      RELEASE_SHA: ${{ github.sha }}
      CF_ACCESS_CLIENT_ID: null
      CF_ACCESS_CLIENT_SECRET: null
      SENTRY_AUTH_TOKEN: null

    steps:
      - name: 💻 Set Environment Variables
        run: |
          echo "DOCKER_IMAGE_BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "RELEASE_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: 📁 Checkout
        uses: actions/checkout@v5

      - name: 🔒 Login to GitHub Container Registry
        uses: docker/login-action@v3
        if: ${{ inputs.docker-push == true }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐬 Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Load 1Password Secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CF_ACCESS_CLIENT_ID: "op://xen65q6xejmrcafvgdfso4lyu4/Cloudflare Access Token/Nombre de usuario"
          CF_ACCESS_CLIENT_SECRET: "op://xen65q6xejmrcafvgdfso4lyu4/Cloudflare Access Token/credencial"
          SENTRY_AUTH_TOKEN: "op://xen65q6xejmrcafvgdfso4lyu4/bbkcjrjfzdyldsai455inxuvni/credencial"

      - name: 🐬 Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-image-name }}
          tags: |
            type=schedule
            type=edge
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          push: ${{ inputs.docker-push }}
          file: ${{ inputs.docker-file }}
          platforms: ${{ inputs.docker-platforms }}
          no-cache: ${{ inputs.docker-no-cache }}
          cache-from: |
            type=registry,ref=${{ inputs.docker-image-name }}:cache-${{ fromJSON(steps.meta.outputs.json).tag-names[0] }}
            type=gha
          cache-to: |
            type=registry,ref=${{ inputs.docker-image-name }}:cache-${{ fromJSON(steps.meta.outputs.json).tag-names[0] }},mode=${{ inputs.docker-cache-mode }},compression=zstd
            type=gha,mode=${{ inputs.docker-gha-cache-mode }}
          build-args: |
            NODE_ENV=${{ inputs.environment }}
            GIT_SHA=${{ github.sha }}
            RELEASE_SHA=${{ env.RELEASE_SHA }}
            SENTRY_AUTH_TOKEN=${{ env.SENTRY_AUTH_TOKEN }}
            ${{ inputs.docker-build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: 🎇 Deploy
        uses: fjogeleit/http-request-action@v1
        if: ${{ inputs.deploy-url != '' && inputs.deploy-url != null }}
        continue-on-error: true
        with:
          url: ${{ inputs.deploy-url }}
          method: POST
          customHeaders: '{ "CF-Access-Client-Id": "${{ env.CF_ACCESS_CLIENT_ID }}", "CF-Access-Client-Secret": "${{ env.CF_ACCESS_CLIENT_SECRET }}" }'
          timeout: 60000
